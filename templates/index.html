<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 웹 서버</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #4f8cff, #8b5cf6);
      color: #fff;
      text-align: center;
    }
    h1 { font-size: 48px; margin: 0 0 12px; }
    p  { font-size: 20px; margin: 4px; }
    .box {
      background: rgba(0, 0, 0, 0.25);
      padding: 40px 60px;
      border-radius: 20px;
    }
    .ver { font-size: 16px; opacity: 0.8; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Hello Docker!</h1>
    <p>나의 첫 번째 웹 서버 컨테이너입니다.</p>
    <p>만든 사람: 홍길동</p>
    <p class="ver">version 1.0</p>
  </div>
</body>
</html>
