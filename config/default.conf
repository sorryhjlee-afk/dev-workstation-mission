server {
    listen       80;
    server_name  localhost;

    # 커스텀 포인트 : 내가 만든 이미지라는 표시를 응답 헤더에 넣는다
    add_header X-Mission "codyssey-m1" always;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # 볼륨 확인용 : /data/ 안의 파일 목록을 보여준다
    location /data/ {
        root      /usr/share/nginx/html;
        autoindex on;
    }
}
